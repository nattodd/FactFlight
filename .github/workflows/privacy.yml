name: Privacy checks
on:
  pull_request:
  push:
    branches: [main, 'v*-development']
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node tests/privacy-check.cjs
      - run: node scripts/privacy-check.cjs --worktree
      - run: node scripts/privacy-check.cjs --commit "$(git rev-parse HEAD)"
