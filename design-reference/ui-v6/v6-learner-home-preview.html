</style></head><body><div class="ribbon">LEARNER HOME · R1 · Sample profiles & results · Nothing is saved</div><header><button class="logo" data-nav="home" aria-label="Fact Flight home"><img src="../../assets/brand/horizontal.svg" alt="Fact Flight"></button><nav aria-label="Main"><button class="quiet" data-nav="home">Home</button><button class="quiet" data-nav="progress">Progress</button><button id="theme" aria-label="Toggle light and dark theme">◐</button></nav></header><main id="app"></main>
<script>
const $=id=>document.getElementById(id);
const activities={
 addition:{name:'Addition',icon:'+',desc:'Put numbers together',levels:['Sums to 5','Sums to 10','Sums to 20','Two-digit sums','Bigger sums'],examples:['2 + 3','4 + 6','8 + 7','24 + 37','684 + 78'],scope:['Sums within 5','Sums within 10','Sums within 20','Both numbers 10–99','One number 100–999, one 10–99']},
 subtraction:{name:'Subtraction',icon:'−',desc:'Find what is left',levels:['Take from 5','Take from 10','Take from 20','Two-digit numbers','Bigger numbers'],examples:['5 − 2','9 − 4','18 − 7','63 − 24','732 − 86'],scope:['Subtract within 5','Subtract within 10','Subtract within 20','Start with 20–99; subtract 10–99','Start with 100–999; subtract 10–99']},
 multiplication:{name:'Multiplication',icon:'×',desc:'Explore times tables',levels:['2, 5 & 10','Tables to 10','Tables to 12','Tables 13–20','Bigger numbers'],examples:['2 × 4','7 × 8','12 × 9','16 × 7','47 × 8'],scope:['2/5/10 tables × 1–10','2–10 tables × 1–10','2–12 tables × 1–12','13–20 × 2–12','21–99 × 2–12']},
 division:{name:'Division',icon:'÷',desc:'Share into equal groups',levels:['2, 5 & 10','Divide by 2–10','Divide by 2–12','Bigger answers','Biggest answers'],examples:['10 ÷ 2','56 ÷ 7','108 ÷ 9','112 ÷ 7','564 ÷ 6'],scope:['Divisors 2/5/10; answers 1–10','Divisors 2–10; answers 1–10','Divisors 2–12; answers 1–12','Divisors 2–12; answers 13–20','Divisors 2–12; answers 21–99']},
 bonds:{name:'Number bonds',icon:'◡',desc:'Find the missing piece',levels:['Make 5','Make 10','Make 20','Make 100','Make 1,000'],examples:['2 + ? = 5','6 + ? = 10','8 + ? = 20','35 + ? = 100','375 + ? = 1000'],scope:['Parts of 5','Parts of 10','Parts of 20','Parts 10–90','Parts 100–900']},
 doubles:{name:'Doubles',icon:'2×',desc:'Twice as many',levels:['Double to 5','Double to 10','Double to 20','Two-digit numbers','Three-digit numbers'],examples:['Double 3','Double 8','Double 16','Double 47','Double 675'],scope:['Double 0–5','Double 0–10','Double 0–20','Double 21–99','Double 100–999']},
 halves:{name:'Halves',icon:'½',desc:'Split into two equal parts',levels:['Halve to 10','Halve to 20','Halve to 40','Bigger numbers','Biggest numbers'],examples:['Half of 6','Half of 18','Half of 32','Half of 94','Half of 1350'],scope:['Even numbers 0–10','Even numbers 0–20','Even numbers 0–40','Even numbers 42–198','Even numbers 200–1,998']},
 squares:{name:'Squares',icon:'n²',desc:'A number times itself',levels:['Numbers 1–5','Numbers 1–10','Numbers 1–12','Numbers 13–20','Numbers 21–50'],examples:['3²','8²','12²','17²','47²'],scope:['Bases 1–5','Bases 1–10','Bases 1–12','Bases 13–20','Bases 21–50']}
};
const modes={quick:['Quick Practice','A little practice','5, 10, 15 or 20 questions. No clock.','⚡'],free:['Free Practice','Take your time','Keep going until you choose Finish. No timer.','∞'],timed:['Timed Practice','Find your rhythm','Choose a set and practice for up to 2 minutes.','◷'],test:['Test','See how you’re doing','60 questions. Up to 2 minutes. Review your results.','✓']};
let screen=['home','math','mode','practice','ready'].includes(new URLSearchParams(location.search).get('screen'))?new URLSearchParams(location.search).get('screen'):'home',trail=[],quickRoute=false,cfg={activity:'addition',mode:'quick',level:0,count:5,table:2,input:'keypad',view:matchMedia('(max-width:680px)').matches?'focus':'worksheet',target:''};
const selected=(a,b)=>a===b?' selected':'';
function go(next,remember=true){if(remember)trail.push(screen);screen=next;render();window.scrollTo(0,0);const heading=$('app').querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}}
function back(){screen=trail.pop()||'home';render();window.scrollTo(0,0)}
const steps=stage=>`<div class="steps" aria-label="Setup steps">${(quickRoute?['Activity','Your practice','Ready']:['Activity','Mode','Your practice','Ready']).map((s,i)=>`<span class="${s===stage?'current':''}">${i+1} · ${s}</span>`).join('')}</div>`;
const backButton=()=>'<button class="quiet back" data-back>← Back</button>';
const context=()=>`<div class="context"><b>${activities[cfg.activity].name}</b><span class="dot">•</span>${cfg.mode==='school'?'Original School Test':modes[cfg.mode][0]}</div>`;
function activityHome(){return `<div class="hero"><div class="eyebrow">Little practice. Big confidence.</div><h1>Where will you fly today?</h1><p>Pick something to explore. A little practice goes a long way.</p></div><section class="quick"><div><div class="eyebrow">Just a few questions</div><h2>Quick Practice</h2><p>Pick any math activity and a small set. No timer.</p><span class="quick-tag">5 · 10 · 15 · 20 questions</span></div><button class="primary launch" data-quick>Let’s go →</button></section><h2>Choose your adventure</h2><div class="tiles"><button class="tile available" data-math><span class="icon">＋</span><strong>Math</strong><span class="sub">Eight ways to play with numbers</span><span class="sub">Explore →</span></button>${[['Aa','Letters & Sounds','Discover letters and their sounds'],['○△','Colors & Shapes','Explore the world around you'],['Ab','Reading','Build confidence with words']].map(([icon,title,desc])=>`<button class="tile" disabled><span class="icon" aria-hidden="true">${icon}</span><strong>${title}</strong><span class="sub">${desc}</span><span class="badge">Coming Soon</span></button>`).join('')}</div><div class="bottom"><span class="small">Free to learn. No account needed.</span><button data-nav="progress">Results & Stats ↗</button><button class="quiet" data-nav="parents">Parent corner</button></div>`}
function math(){return `${backButton()}${steps('Activity')}<div class="hero"><div class="eyebrow">${quickRoute?'Quick Practice':'Math'}</div><h1>What shall we practice?</h1><p>${quickRoute?'Any activity. A few questions. You choose.':'Tap a tile to start your next adventure.'}</p></div><div class="tiles">${Object.entries(activities).map(([id,a])=>`<button class="tile" data-activity="${id}"><span class="icon">${a.icon}</span><strong>${a.name}</strong><span class="sub">${a.desc}</span></button>`).join('')}</div>${quickRoute?'':`<section class="row school"><div><h3>The original School Test</h3><p>Multiplication · 60 facts · 2 minutes · tables 2–10</p></div><button data-school>Choose a table →</button></section>`}`}
function mode(){return `${backButton()}${steps('Mode')}<div class="hero"><div class="eyebrow">${activities[cfg.activity].name}</div><h1>How would you like to practice?</h1><p>A little at a time, or a challenge? It’s up to you.</p></div><div class="tiles modes">${Object.entries(modes).map(([id,m])=>`<button class="tile" data-mode="${id}"><span class="icon">${m[3]}</span><strong>${m[0]}</strong><span class="sub">${m[1]}</span><span class="sub">${m[2]}</span></button>`).join('')}</div>${cfg.activity==='multiplication'?'<div class="row school"><div><h3>Practicing for school?</h3><p>The original 60-fact, two-minute multiplication test.</p></div><button data-school>School Test →</button></div>':''}`}
function practice(){const a=activities[cfg.activity],school=cfg.mode==='school';return `${backButton()}${steps('Your practice')}${context()}<h1>${school?'Which times table?':'Pick your challenge.'}</h1><p>${school?'The same school test you know. Pick a table to begin.':'Every level is open. Pick what feels right today.'}</p>${school?`<div class="pills section">${Array.from({length:9},(_,i)=>i+2).map(n=>`<button class="${selected(cfg.table,n)}" aria-pressed="${cfg.table===n}" data-table="${n}">${n}</button>`).join('')}</div>`:`<div class="levels section">${a.levels.map((label,i)=>`<button class="choice${selected(cfg.level,i)}" aria-pressed="${cfg.level===i}" data-level="${i}"><span class="number">Level ${i+1}</span><strong>${label}</strong><span class="example">${a.examples[i]}</span></button>`).join('')}</div><p class="example-note">Selected: ${a.scope[cfg.level]} · whole-number answers</p>`}${cfg.mode==='free'?'<div class="review"><strong>Keep going until Finish</strong><p>No question limit and no timer.</p></div>':['school','test'].includes(cfg.mode)?'<div class="review"><strong>60 questions · 2 minutes</strong><p>Finish early if you need to. You can review every answer afterward.</p></div>':`<section class="section"><h2>How many questions?</h2><div class="pills">${(cfg.mode==='quick'?[5,10,15,20]:[5,10,15,20,30,60]).map(n=>`<button class="${selected(cfg.count,n)}" aria-pressed="${cfg.count===n}" data-count="${n}">${n}</button>`).join('')}</div><p class="small">${cfg.mode==='timed'?'Up to 2 minutes. The clock starts when you’re ready.':'No time limit. Take your time.'}</p></section>`}<div class="footer-action"><p>Next: choose how to answer.</p><button class="primary" data-next>Continue →</button></div>`}
function ready(){return `${backButton()}${steps('Ready')}${context()}<h1>Ready for takeoff?</h1><p>Choose how you want to answer.</p><div class="pair"><button class="tile${selected(cfg.input,'keypad')}" data-input="keypad" aria-pressed="${cfg.input==='keypad'}"><span class="icon">▦</span><strong>Tap or type</strong><span class="sub">Use the number pad or your keyboard.</span></button><button class="tile${selected(cfg.input,'voice')}" data-input="voice" aria-pressed="${cfg.input==='voice'}"><span class="icon">♪</span><strong>Say it out loud</strong><span class="sub">Use your microphone. Say “ready” to begin.</span></button></div><section class="section"><h2>How do you want to see it?</h2><div class="pair"><button class="tile${selected(cfg.view,'focus')}" data-view="focus" aria-pressed="${cfg.view==='focus'}"><span class="view-art">[ ? ]</span><strong>One at a time</strong><span class="sub">Focus View · one big, clear question.</span></button><button class="tile${selected(cfg.view,'worksheet')}" data-view="worksheet" aria-pressed="${cfg.view==='worksheet'}"><span class="view-art">☷ ☷ ☷</span><strong>The whole sheet</strong><span class="sub">Worksheet View · see your set of facts.</span></button></div></section><div class="review"><strong>${activities[cfg.activity].name} · ${cfg.mode==='school'?cfg.table+' times table':'Level '+(cfg.level+1)}</strong><p>${cfg.mode==='school'?'Original School Test':modes[cfg.mode][0]} · ${cfg.mode==='free'?'Unlimited':(['test','school'].includes(cfg.mode)?60:cfg.count)} questions · ${['test','school','timed'].includes(cfg.mode)?'2 minutes':'no time limit'}</p></div><details><summary>Grown-up options</summary><label for="target">Optional first-try goal</label><p>Leave blank for no goal. This never blocks practice.</p><input id="target" type="number" min="1" max="${['school','test'].includes(cfg.mode)?60:cfg.count}" value="${cfg.target}" placeholder="No goal"><p>Skip, Undo, Finish, recognized speech, results review, and history exports remain part of the working app.</p></details><div class="footer-action"><p>${cfg.input==='voice'?'In the app: allow the microphone, then say “ready.”':'Your keyboard or number pad is ready.'}</p><button class="primary" data-start>Start ${cfg.mode==='school'?'School Test':cfg.mode==='test'?'test':'practice'} →</button></div>`}
function launch(){return `${backButton()}<div class="center"><div class="icon">✈</div><div class="eyebrow">End of menu preview</div><h1>And now, we practice.</h1><p>This is where the working ${cfg.view==='focus'?'Focus':'Worksheet'} session would open.</p><div class="finish-demo">${cfg.mode==='school'?cfg.table+' × 3 = ?':activities[cfg.activity].examples[cfg.level]}</div><div class="review"><strong>${activities[cfg.activity].name} · ${cfg.input==='voice'?'Voice':'Tap / keyboard'}</strong><p>No microphone was opened and no flight was started. This mockup only demonstrates the menu flow.</p></div><div class="footer-action"><button data-nav="home">Back to Home</button><button class="primary" data-revise>Change my choices</button></div></div>`}
function progress(){return `${backButton()}<div class="hero"><div class="eyebrow">Results & Stats</div><h1>Every try counts.</h1><p>A clear way back to the activity summaries and flight reviews you already tested.</p></div><div class="tiles">${Object.entries(activities).map(([id,a])=>`<button class="tile" data-report="${id}"><span class="icon">${a.icon}</span><strong>${a.name}</strong><span class="sub">Flights · correct / incorrect<br>First-attempt correct</span></button>`).join('')}</div><div class="notice">Navigation preview only. No saved history is read. In the app, choose an activity to see its totals and flights, then review a flight. JSON and CSV exports stay here.</div>`}
function report(){return `${backButton()}<div class="hero"><div class="eyebrow">Results & Stats</div><h1>${activities[cfg.activity].name}</h1><p>Activity totals → flight list → individual flight review.</p></div><div class="review">Your existing report belongs here. This menu mockup does not invent or load student results.</div>`}
function parents(){return `${backButton()}<div class="hero"><div class="eyebrow">Parent corner</div><h1>A little help for grown-ups.</h1><p>Keep the practice path simple. Keep guidance easy to find.</p></div><details open><summary>Microphone help</summary><p>The working app keeps its permission instructions and reconnect option. Browser speech may use an online service. The app stores recognized text with results locally; it does not save audio recordings.</p></details><details><summary>Results and backups</summary><p>Results & Stats retains activity totals, flight reviews, and JSON/CSV exports. Results stay in this browser unless deliberately exported.</p></details><div class="notice">Profiles use optional nicknames, with no sign-in or password. This preview uses sample data only; all changes reset on reload.</div>`}
function render(){document.querySelectorAll('nav [data-nav]').forEach(b=>{if(b.dataset.nav===screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('app').innerHTML=({home,create,activityHome,statsPicker,math,mode,practice,ready,launch,progress,report,flight,parents}[screen])()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.nav==='progress'){go('statsPicker');return} if(d.nav){if(d.nav==='home'){trail=[];quickRoute=false;go(learnerSelected?'activityHome':'home',false);return}go(d.nav);return}if('back'in d){back();return}
 if('quick'in d){quickRoute=true;cfg.mode='quick';cfg.count=5;go('math');return}if('math'in d){quickRoute=false;go('math');return}
 if(d.activity){cfg.activity=d.activity;cfg.level=0;go(quickRoute?'practice':'mode');return}
 if(d.mode){cfg.mode=d.mode;cfg.count=d.mode==='quick'?5:20;go('practice');return}
 if('school'in d){cfg.activity='multiplication';cfg.mode='school';cfg.view='worksheet';go('practice');return}
 if('level'in d){cfg.level=Number(d.level);render();return}if('count'in d){cfg.count=Number(d.count);render();return}if('table'in d){cfg.table=Number(d.table);render();return}
 if('next'in d){go('ready');return}if(d.input){cfg.input=d.input;render();return}if(d.view){cfg.view=d.view;render();return}
 if('start'in d){go('launch');return}if('revise'in d){go('ready');return}if(d.report){cfg.activity=d.report;go('report');return}
});document.addEventListener('input',e=>{if(e.target.id==='target')cfg.target=e.target.value.replace(/[^0-9]/g,'')});
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let learners=[{id:'alex',name:'Alex'},{id:'sam',name:'Sam'},{id:'riley',name:'Riley'}],learner=null,reportLearner=null,nextId=1,learnerSelected=false;
const who=()=>learner?learner.name:'Guest';
const profileTile=(p,stats=false)=>`<button class="learner" ${stats?'data-stats':'data-learner'}="${p.id}"><span class="avatar" aria-hidden="true">${esc(p.name.slice(0,1).toUpperCase())}</span><strong>${esc(p.name)}</strong><span>${stats?'See results':'Tap to start'}</span></button>`;
function home(){return `<section class="entry"><div class="eyebrow">Your learning space</div><div class="accent-line"></div><h1>Who's ready to take flight?</h1><p class="intro">Pick a learner, or jump in as a guest.<br>No sign-in, no fuss.</p><div class="learners">${learners.map(p=>profileTile(p)).join('')}<button class="learner outline" data-create><span class="avatar" aria-hidden="true">+</span><strong>Create Profile</strong><span>Nickname only</span></button><button class="learner outline" data-guest><span class="avatar" aria-hidden="true">☆</span><strong>Continue as Guest</strong><span>Not saved</span></button></div><button class="primary results-link" data-nav="progress">Results & Stats →</button><p class="family-footer">Free to learn · No account needed · Progress stays on this device</p><details class="demo-tools"><summary>Preview controls · sample data only</summary><p>Try a first visit with no learners, then create one. All changes reset when you reload. Guest's “Not saved” policy is proposed for review.</p><button data-empty>Show first visit</button> <button data-samples>Restore sample learners</button></details></section>`}
function create(){return `${backButton()}<div class="form-card"><span class="avatar" aria-hidden="true">+</span><h1>A little space of your own.</h1><p>Create a learner profile. No email or password needed.</p><form id="profileForm"><label for="nickname">What should we call you?</label><p id="nicknameHelp">A nickname is enough. You can leave this blank.</p><input id="nickname" name="nickname" maxlength="24" autocomplete="off" aria-describedby="nicknameHelp" placeholder="e.g. Sunny"><p class="small">In the finished app, this learner's progress will stay in this browser on this device.</p><button class="primary" type="submit">Create profile & explore →</button></form><button class="quiet" data-nav="home" style="margin-top:12px;width:100%">Cancel</button></div>`}
const baseActivityHome=activityHome;
activityHome=()=>`<div class="identity"><div><strong>${esc(who())}'s practice</strong><p class="small">${learner?'Your own learning space':'Guest · results are not saved'}</p></div><button data-change-learner>Change learner</button></div>`+baseActivityHome();
function statsPicker(){return `<section class="entry"><div class="eyebrow">Results & Stats</div><h1>Whose progress shall we see?</h1><p class="intro">Each learner has their own story.</p><div class="learners">${learners.map(p=>profileTile(p,true)).join('')}<button class="learner outline" data-stats="previous"><span class="avatar" aria-hidden="true">↶</span><strong>Previous progress</strong><span>Before profiles</span></button></div><p class="notice">Sample results only. Existing history will stay separate until you deliberately choose otherwise.</p></section>`}
const totals=()=>reportLearner==='alex'?[4,36,4,30]:reportLearner==='sam'?[2,17,3,14]:reportLearner==='previous'?[3,26,4,21]:[0,0,0,0];
const reportName=()=>reportLearner==='previous'?'Previous progress':learners.find(p=>p.id===reportLearner)?.name||'Learner';
const statCards=t=>`<div class="statgrid">${['Flights','Correct','Incorrect at finish','First attempt correct'].map((v,i)=>`<div><strong>${t[i]}</strong><span>${v}</span></div>`).join('')}</div>`;
progress=()=>`${backButton()}<div class="eyebrow">Sample results · ${esc(reportName())}</div><h1>Every try counts.</h1><p>Choose an activity to see flights and answers.</p>${statCards(totals())}<div class="tiles">${Object.entries(activities).map(([id,a])=>`<button class="tile" data-report="${id}"><span class="icon">${a.icon}</span><strong>${a.name}</strong><span class="sub">${id==='addition'?totals()[0]:0} flights · ${id==='addition'?totals()[1]:0} correct</span></button>`).join('')}</div>`;
report=()=>`${backButton()}<div class="eyebrow">${esc(reportName())} · sample results</div><h1>${activities[cfg.activity].name}</h1>${statCards(cfg.activity==='addition'?totals():[0,0,0,0])}${cfg.activity==='addition'&&totals()[0]?Array.from({length:totals()[0]},(_,i)=>`<button class="flight-row" data-flight><strong>Practice flight ${i+1}</strong><span>Review answers →</span></button>`).join(''):'<div class="review">No flights yet. A little practice is a great start.</div>'}`;
function flight(){return `${backButton()}<div class="eyebrow">Illustrative flight review</div><h1>A closer look at your flight.</h1><p>This screen shows the proposed review route. Sample summary totals are illustrative; no real flight is loaded.</p><div class="review"><h2>2 + 3 = 5 ✓</h2><p>Correct on the first attempt.</p><h2>4 + 2 = 6 ✓</h2><p>Correct after a retry.</p></div><button data-nav="progress">Choose another learner</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if('learner'in d){learner=learners.find(p=>p.id===d.learner);learnerSelected=true;go('activityHome')}
if('guest'in d){learner=null;learnerSelected=true;go('activityHome')}
if('changeLearner'in d){learnerSelected=false;learner=null;trail=[];go('home',false)}
if('create'in d)go('create');
if('stats'in d){reportLearner=d.stats;go('progress')}
if('flight'in d)go('flight');
if('empty'in d){learners=[];learner=null;learnerSelected=false;render()}
if('samples'in d){learners=[{id:'alex',name:'Alex'},{id:'sam',name:'Sam'},{id:'riley',name:'Riley'}];render()}
});
document.addEventListener('submit',e=>{if(e.target.id!=='profileForm')return;e.preventDefault();const name=$('nickname').value.trim()||'Learner '+(learners.length+1);learner={id:'new-'+nextId++,name};learners.push(learner);learnerSelected=true;go('activityHome')});
screen='home';

$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};render();
</script></body></html>
