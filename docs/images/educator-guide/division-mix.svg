14">0</text><rect x="546" y="915" width="34" height="0" fill="#d55e00"/><text x="549" y="907" font-size="14">0</text><text x="500" y="943" font-size="18">L3</text><rect x="645" y="915" width="34" height="0" fill="#334155"/><text x="648" y="907" font-size="14">0</text><rect x="688" y="915" width="34" height="0" fill="#0072b2"/><text x="691" y="907" font-size="14">0</text><rect x="731" y="915" width="34" height="0" fill="#d55e00"/><text x="734" y="907" font-size="14">0</text><text x="685" y="943" font-size="18">L4</text><rect x="830" y="915" width="34" height="0" fill="#334155"/><text x="833" y="907" font-size="14">0</text><rect x="873" y="915" width="34" height="0" fill="#0072b2"/><text x="876" y="907" font-size="14">0</text><rect x="916" y="915" width="34" height="0" fill="#d55e00"/><text x="919" y="907" font-size="14">0</text><text x="870" y="943" font-size="18">L5</text><text x="28" y="982" font-size="15">Repeat means an encounter beyond the first occurrence of its family, anywhere in the flight.</text><text x="28" y="1007" font-size="15">L1 / L4 / L5 retain current pools. More focus can mean fewer distinct facts in a short flight.</text></svg>
